name: Finalize UX design system

on:
  push:
    paths:
      - '.github/workflows/design-system-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Finalize design system
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/design-system.css')
          s=p.read_text()
          s=s.replace("button:not(.day):not(.dot):not(.statistics-volume-column){min-height:44px}\n", "")
          s=s.replace(".statistics-tabs button,.statistics-range button,.statistics-period-type button,.auth-tab,.nutrition-segment button{min-height:42px!important;border-radius:11px!important;font-size:var(--text-caption)!important;font-weight:var(--weight-semibold)!important}", ".statistics-tabs button,.statistics-range button,.statistics-period-type button,.auth-tab,.nutrition-segment button{min-height:42px!important;border-radius:11px!important;font-size:var(--text-caption)!important;font-weight:var(--weight-semibold)!important}\n.statistics-tabs button{font-size:11px!important}")
          p.write_text(s)

          Path('docs/design-system.md').write_text('''# Gym App design system\n\nThis file is the source-of-truth companion to `src/design-system.css`. New screens should reuse these tokens rather than introduce one-off dimensions.\n\n## Layout\n- Mobile canvas: max 430px.\n- Horizontal page inset: 18px (16px on <=370px).\n- Spacing scale: 4, 8, 12, 16, 20, 24, 32px.\n- Default card gap: 12px; section gap: 24px; card padding: 18px.\n\n## Typography\nSingle UI family: Inter, weights 400/500/600/700/800.\n- Display: 32/36, 700.\n- H1: 28/32, 700.\n- H2: 20/24, 700.\n- H3: 16/21, 600.\n- Body: 14/20, 400.\n- Caption: 12/16, 500.\n- Micro: 10/13, 600-700.\n\n## Components\n- Radii: 12px small, 16px control, 24px card, 28px hero.\n- Primary controls: 50px high, 16px radius.\n- Nested topbar controls: 44x44px.\n- Catalog images: 96x96px.\n- Visual section tabs: 72x72px icon tile.\n- Bottom navigation: 72px high, 24px icons, 10px labels.\n- Use the neutral surface/background/ink palette already defined in `styles.css`; semantic color is reserved for status/warning/error/success.\n\n## Rules\n1. Do not add a new font size, radius or page inset without first checking existing tokens.\n2. Root screens use a section title + visual navigation where needed; detail screens use one centered nested topbar and do not repeat the parent section navigation.\n3. Lists in catalog-style screens use the same image/card geometry.\n4. Forms use consistent 50px controls and labels.\n5. Active workout may hide bottom navigation; ordinary detail screens keep app navigation according to their current product flow.\n6. All interactive elements need visible focus and reduced-motion support.\n''')
          PY
      - name: Build
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test:lifecycle
          pnpm build
      - name: Commit normalized UX
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/design-system.css docs/design-system.md
          git rm .github/workflows/design-system-finalize.yml
          git commit -m "Complete app-wide UX normalization"
          git push
