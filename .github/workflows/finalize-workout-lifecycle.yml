name: Finalize workout lifecycle

on:
  push:
    paths:
      - '.github/workflows/finalize-workout-lifecycle.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Apply lifecycle fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          home = Path('src/components/HomeScreen.jsx')
          text = home.read_text()

          # Active/paused session is always the primary next step on today's Home screen,
          # even if its original scheduled date is different.
          old = """    if (response.error && response.error.code !== 'PGRST116') throw response.error;\n    if (response.data?.scheduled_date === dateKey) { workoutRow = response.data; active = true; }\n  }\n  if (!workoutRow) {"""
          new = """    if (response.error && response.error.code !== 'PGRST116') throw response.error;\n    const todayKey = toDateKey(new Date());\n    if (response.data && (response.data.scheduled_date === dateKey || dateKey === todayKey)) { workoutRow = response.data; active = true; }\n  }\n  if (!workoutRow) {"""
          if old not in text:
              raise SystemExit('Home active workout priority fragment not found')
          text = text.replace(old, new, 1)

          # If today has no workout and there is no live session, surface the earliest
          # overdue/skipped workout as the next recovery action instead of showing empty state.
          old = """  if (!workoutRow) return null;\n\n  let hasLaterCompleted = false;"""
          new = """  let recovery = false;\n  if (!workoutRow && dateKey === toDateKey(new Date())) {\n    const recoveryResponse = await supabase\n      .from('scheduled_workouts')\n      .select('id, user_program_id, workout_name, scheduled_date, status, sequence_number, user_programs!inner(status)')\n      .lt('scheduled_date', dateKey)\n      .in('status', ['scheduled', 'skipped'])\n      .eq('user_programs.status', 'active')\n      .order('scheduled_date', { ascending: true })\n      .order('sequence_number', { ascending: true })\n      .limit(1);\n    if (recoveryResponse.error) throw recoveryResponse.error;\n    workoutRow = recoveryResponse.data?.[0] ?? null;\n    recovery = Boolean(workoutRow);\n  }\n  if (!workoutRow) return null;\n\n  let hasLaterCompleted = false;"""
          if old not in text:
              raise SystemExit('Home recovery insertion point not found')
          text = text.replace(old, new, 1)

          old = """    canShiftTail: !hasLaterCompleted,\n    editable,\n  };"""
          new = """    canShiftTail: !hasLaterCompleted,\n    editable,\n    recovery,\n  };"""
          if old not in text:
              raise SystemExit('Home workout mapping fragment not found')
          text = text.replace(old, new, 1)

          old = """function WorkoutSummary({ workout, status, isToday, onOpenWorkout, onRetry }) {"""
          new = """function WorkoutSummary({ workout, status, isToday, onOpenWorkout, onRetry, onEditWorkout }) {"""
          if old not in text:
              raise SystemExit('WorkoutSummary signature not found')
          text = text.replace(old, new, 1)

          old = """  const skipped = workout.status === 'skipped';\n  const buttonLabel = workout.active ? 'Продолжить тренировку' : (workout.completed ? 'Посмотреть результат' : (skipped ? 'Пропущена' : 'К тренировке'));\n  return <section className=\"summary-col workout\"><div className=\"summary-label\">{workout.active ? 'Активная тренировка' : (skipped ? 'Пропущенная тренировка' : 'Тренировка')}</div><h3>{workout.title}</h3><p>{workout.exerciseCount} упражнений</p><button className=\"workout-btn\" type=\"button\" disabled={skipped} onClick={() => !skipped && onOpenWorkout?.(workout.id)}>{buttonLabel}</button></section>;"""
          new = """  const skipped = workout.status === 'skipped';\n  const recovery = Boolean(workout.recovery);\n  const buttonLabel = workout.active ? 'Продолжить тренировку' : (workout.completed ? 'Посмотреть результат' : (recovery ? 'Перенести на сегодня' : (skipped ? 'Пропущена' : 'К тренировке')));\n  return <section className={`summary-col workout${recovery ? ' recovery' : ''}`}><div className=\"summary-label\">{workout.active ? 'Активная тренировка' : (recovery ? 'Пропущенная тренировка' : (skipped ? 'Пропущенная тренировка' : 'Тренировка'))}</div><h3>{workout.title}</h3><p>{recovery ? `Плановая дата: ${formatFullDate(dateFromKey(workout.scheduledDate))}` : `${workout.exerciseCount} упражнений`}</p><button className=\"workout-btn\" type=\"button\" disabled={skipped && !recovery} onClick={() => recovery ? onEditWorkout?.() : (!skipped && onOpenWorkout?.(workout.id))}>{buttonLabel}</button></section>;"""
          if old not in text:
              raise SystemExit('WorkoutSummary body not found')
          text = text.replace(old, new, 1)

          old = """<WorkoutSummary workout={workout} status={workoutStatus} isToday={isToday} onOpenWorkout={onOpenWorkout} onRetry={onRetry} />"""
          new = """<WorkoutSummary workout={workout} status={workoutStatus} isToday={isToday} onOpenWorkout={onOpenWorkout} onRetry={onRetry} onEditWorkout={onEditWorkout} />"""
          if old not in text:
              raise SystemExit('WorkoutSummary usage not found')
          text = text.replace(old, new, 1)

          old = """    setScheduleEditor({ workout: effectiveWorkout, originalDate: selectedDateKey });\n    setScheduleStep('date');\n    setScheduleDate(selectedDateKey < todayKey ? todayKey : selectedDateKey);"""
          new = """    const originalDate = effectiveWorkout.scheduledDate || selectedDateKey;\n    setScheduleEditor({ workout: effectiveWorkout, originalDate });\n    setScheduleStep('date');\n    setScheduleDate(originalDate < todayKey ? todayKey : originalDate);"""
          if old not in text:
              raise SystemExit('Schedule editor opening fragment not found')
          text = text.replace(old, new, 1)

          # Remove the obsolete completion percentage from KБЖУ: the app does not track food intake.
          text = text.replace("<div className=\"food-stat\"><strong>{nutritionPlan.completion ?? 0}%</strong><span>Выполнено</span></div>", "")
          home.write_text(text)

          # Program participation terminology: cancelled is the terminal user-program status.
          detail = Path('src/components/ProgramDetailScreen.jsx')
          text = detail.read_text()
          text = text.replace("if (participation.status === 'abandoned') return 'Остановлена';", "if (participation.status === 'cancelled') return 'Отменена';")
          text = text.replace("['completed', 'abandoned'].includes(participation.status)", "['completed', 'cancelled'].includes(participation.status)")
          detail.write_text(text)

          # Keep error copy aligned with paused-workout behavior.
          pp = Path('src/lib/programParticipation.js')
          text = pp.read_text().replace('Сначала завершите или отмените текущую тренировку.', 'Сначала завершите текущую тренировку или снимите её с паузы и завершите.')
          pp.write_text(text)
          PY

      - name: Add lifecycle contract tests
        shell: bash
        run: |
          mkdir -p tests
          cat > tests/workout-lifecycle-contracts.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const read = (p) => fs.readFileSync(p, 'utf8');
          const home = read('src/components/HomeScreen.jsx');
          const detail = read('src/components/ProgramDetailScreen.jsx');
          const sessions = read('src/lib/workoutSessions.js');
          const lifecycle = read('supabase/schema/workout-session-lifecycle.sql');
          const statuses = read('supabase/schema/program-status-lifecycle.sql');

          assert.match(home, /recoveryResponse[\s\S]*\.lt\('scheduled_date', dateKey\)/, 'Home must surface overdue workouts');
          assert.match(home, /Перенести на сегодня/, 'Recovery CTA must reschedule before starting');
          assert.match(home, /effectiveWorkout\.scheduledDate \|\| selectedDateKey/, 'Recovery editor must use the workout original date');
          assert.doesNotMatch(home, /Выполнено<\/span>/, 'Nutrition completion must not be shown when intake is not tracked');

          assert.match(detail, /participation\.status === 'cancelled'/, 'Program UI must support cancelled status');
          assert.doesNotMatch(detail, /participation\.status === 'abandoned'/, 'Program UI must not use abandoned participation status');
          assert.match(statuses, /active','paused','completed','cancelled/, 'Program status contract must be documented');

          assert.match(lifecycle, /paused_at/, 'Workout pause state must be persisted');
          assert.match(lifecycle, /active_duration_seconds/, 'Workout active duration must be persisted');
          assert.match(lifecycle, /future/i, 'Future workout start guard must be documented');
          assert.match(sessions, /set_type !== 'working'/, 'Best-set history must exclude warmups');
          assert.match(sessions, /\.eq\('status', 'completed'\)/, 'History must use completed sessions only');

          console.log('Workout lifecycle contract tests passed.');
          EOF

          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.scripts={...p.scripts,'test:lifecycle':'node tests/workout-lifecycle-contracts.mjs'}; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"

      - name: Document status schema
        shell: bash
        run: |
          cat > supabase/schema/program-status-lifecycle.sql <<'EOF'
          -- Canonical participation status model.
          -- Mirrors production migration program_cancelled_status_and_lifecycle_contracts.
          update public.user_programs set status = 'cancelled', updated_at = now() where status = 'abandoned';
          alter table public.user_programs drop constraint if exists user_programs_status_check;
          alter table public.user_programs add constraint user_programs_status_check
            check (status in ('active','paused','completed','cancelled'));

          create or replace function public.cancel_program(p_user_program_id uuid)
          returns uuid language plpgsql set search_path = '' as $$
          declare v_user_id uuid := auth.uid();
          begin
            if v_user_id is null then raise exception 'Authentication required' using errcode='42501'; end if;
            update public.user_programs set status='cancelled', updated_at=now()
            where id=p_user_program_id and user_id=v_user_id and status in ('active','paused');
            if not found then raise exception 'Active program participation not found' using errcode='P0002'; end if;
            update public.scheduled_workouts set status='cancelled'
            where user_program_id=p_user_program_id and status in ('scheduled','skipped');
            return p_user_program_id;
          end;
          $$;
          grant execute on function public.cancel_program(uuid) to authenticated;
          EOF

      - name: Run lifecycle tests
        run: pnpm test:lifecycle
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Commit finalized lifecycle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HomeScreen.jsx src/components/ProgramDetailScreen.jsx src/lib/programParticipation.js tests/workout-lifecycle-contracts.mjs package.json supabase/schema/program-status-lifecycle.sql
          git commit -m "Finish workout and program lifecycle" || exit 0
          git push
